<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greeting</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      font-weight: 500;
    }
    input {
      padding: 0.5rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #error {
      margin-top: 1rem;
      color: #b00020;
      overflow-wrap: anywhere;
    }
    #error:empty, #greeting:empty {
      display: none;
    }
    #greeting {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #333;
      overflow-wrap: anywhere;
    }
    footer {
      margin-top: 2rem;
      color: #666;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <form id="greet-form">
    <label for="name">Your name</label>
    <input id="name" name="name" type="text" autocomplete="name">
    <button type="submit">Greet</button>
  </form>
  <p id="error" role="alert"></p>
  <p id="greeting"></p>
  <footer id="footer"></footer>

  <script type="module">
    import { greet } from './greeting.js';

    const form = document.getElementById('greet-form');
    const nameInput = document.getElementById('name');
    const greetingEl = document.getElementById('greeting');
    const errorEl = document.getElementById('error');
    document.getElementById('footer').textContent = `© ${new Date().getFullYear()} Greeting`;
    const ERROR_MESSAGE = 'Please enter your name.';

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const result = greet(nameInput.value);
      if (result.ok) {
        errorEl.textContent = '';
        nameInput.removeAttribute('aria-invalid');
        nameInput.removeAttribute('aria-describedby');
        greetingEl.textContent = result.message;
      } else {
        greetingEl.textContent = '';
        errorEl.textContent = ERROR_MESSAGE;
        nameInput.setAttribute('aria-invalid', 'true');
        nameInput.setAttribute('aria-describedby', 'error');
        nameInput.focus();
      }
    });
  </script>
</body>
</html>
