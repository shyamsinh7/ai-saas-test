{"name": "CI", "on": ["pull_request"], "jobs": {"changelog": {"name": "Add a CHANGELOG.md entry in a follow-up commit", "runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4", "with": {"fetch-depth": 0}}, {"run": "n=$(git rev-list --count origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}); if grep -qE '^## ' CHANGELOG.md && [ \"$n\" -ge 2 ]; then echo ok; else echo \"::error::Add a CHANGELOG.md entry in a follow-up commit (this PR has $n commit)\"; exit 1; fi"}]}}}
