name: Deploy staging
# Started by the AI SaaS platform after an agent's pull request merges (docs/STAGING.md).
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One deployment at a time. A newer one replaces one still waiting, which then reports cancelled.
concurrency:
  group: staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The site is built (Vite) into dist/; only that is published.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
